# New public static demo. Existing gated applications are untouched.
server {
    listen 443 ssl; http2 on;
    server_name ff.buplayground.cn;
    ssl_certificate /data/app/huanghaibin/web/letsencrypt/live/ff.buplayground.cn/fullchain.pem;
    ssl_certificate_key /data/app/huanghaibin/web/letsencrypt/live/ff.buplayground.cn/privkey.pem;
    root /data/app/huanghaibin/web/sites/ff-garden/current;
    index index.html;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    expires -1;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location ~ /\. { deny all; }
    location ~* \.(blend|blend1|py|md|zip|env)$ { return 404; }
    location ~* \.html$ { try_files $uri =404; }
    # Vite output files have content hashes. Source GLB/PNG paths do not.
    location ~ ^/assets/[^/]+-[A-Za-z0-9_-]+\.(js|css)$ { expires 1y; try_files $uri =404; }
    location /assets/ { expires 1h; try_files $uri =404; }
    location /data/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
