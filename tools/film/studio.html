<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影片逐帧录制与画面对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#20231f;color:#eee;font:13px system-ui}nav{height:60px;display:flex;align-items:center;gap:8px;padding:8px}button,input{font:inherit;padding:7px}iframe{display:block;border:0;width:100vw;height:calc(100vh - 60px)}output{margin-left:auto}</style>
<nav><button id="start" disabled>开始完整影片</button><button id="step" disabled>推进 1 帧</button><button id="ten" disabled>推进 1 秒</button><button id="outskirts" disabled>风车远景</button><button id="stairs" disabled>楼梯行走</button><button id="lamps" disabled>王城灯光</button><button id="oldao" disabled>光晕遮蔽对照</button><button id="audio" disabled>导出声音</button><output id="status" data-ready="false" data-frame="0">加载中</output></nav>
<output id="camera-samples" hidden></output>
<iframe id="scene" src="/city.html?qa&capture=1&time=day" title="影片画面"></iframe>
<script type="module">
const frame=document.querySelector('#scene'),out=document.querySelector('#status');let W,F,Q,n=0,t0=0,busy=false,started=false,mode='preview';const samples=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function report(){out.dataset.frame=n;out.dataset.mode=mode;out.dataset.done=String(F.done);out.textContent=`${mode} · ${n} 帧 · ${((F.vt-t0)/1000).toFixed(2)} 秒${F.done?' · 完成':''}`;}
async function step(count=1){if(busy)return;busy=true;try{for(let i=0;i<count;i++){await F.step();n++;if(mode==='stairs')samples.push({frame:n,x:Q.debug.camera.position.x,y:Q.debug.camera.position.y,z:Q.debug.camera.position.z});}document.querySelector('#camera-samples').textContent=JSON.stringify(samples);report();}catch(e){out.textContent=e.stack;out.dataset.error=e.message;}finally{busy=false;}}
frame.onload=async()=>{try{W=frame.contentWindow;for(let i=0;i<2400;i++){if(W.__film){F=W.__film;await F.step(50);if(W.document.querySelector('#city-state')?.dataset.ready==='true')break;}await wait(50);}Q=W.__cityQA;if(!Q)throw Error('场景加载失败');for(let i=0;i<90;i++)await F.step();t0=F.vt;out.dataset.ready='true';document.querySelectorAll('button').forEach(b=>b.disabled=false);report();}catch(e){out.textContent=e.message;out.dataset.error=e.message;}};
document.querySelector('#step').onclick=()=>step();document.querySelector('#ten').onclick=()=>step(30);
document.querySelector('#start').onclick=async()=>{if(started)return;started=true;mode='film';const s=W.document.createElement('script');s.src='/tools/film/lamplighter.js';W.document.head.append(s);await new Promise((r,j)=>{s.onload=r;s.onerror=j;});t0=F.vt;n=0;W.__filmT0=t0;W.__runFilm().catch(e=>{F.done=true;out.dataset.error=e.stack;});report();};
function dusk(){const b=W.document.querySelector('#time-toggle');if(b.getAttribute('aria-pressed')!=='true')b.click();}
function hideUI(){if(W.document.querySelector('#review-style'))return;const s=W.document.createElement('style');s.id='review-style';s.textContent='header,.places,.top-right,footer,.touch-pad,#nearby,.story-tracker,.story-hand,.story-marker,#notice{display:none!important}';W.document.head.append(s);}
let previewCamera=null;function view(pos,look,fov=40){hideUI();const d=Q.debug;d.camera.fov=fov;d.camera.updateProjectionMatrix();d.camera.position.set(...pos);d.camera.lookAt(...look);if(previewCamera)F.tasks.delete(previewCamera);previewCamera=()=>{d.camera.position.set(...pos);d.camera.lookAt(...look);};const render=d.composer.render.bind(d.composer);if(!d.composer.__reviewRender){d.composer.__reviewRender=render;d.composer.render=function(...args){previewCamera?.();return render(...args);};}}
document.querySelector('#outskirts').onclick=async()=>{mode='windmill';dusk();view([-22,24,-57],[-79,8,12],30);await step();};
document.querySelector('#lamps').onclick=async()=>{mode='lamps';dusk();view([-1,13,-50],[-1,7,-73],50);const d=Q.debug;if(!W.__testHalo){const source=[];d.scene.traverse(o=>{if(o.isSprite&&o.material.fog===false&&o.material.map)source.push(o);});const material=source[0].material.clone();material.opacity=1;material.blending=d.THREE.AdditiveBlending;W.__testHalo=Q.episode.qa.lampHeads.slice(-2).map(p=>{const s=new d.THREE.Sprite(material);s.position.copy(p);s.scale.setScalar(4.4);d.scene.add(s);return s;});}await step();};
document.querySelector('#oldao').onclick=async()=>{Q.debug.ao.excludeSprites=!Q.debug.ao.excludeSprites;out.dataset.legacy=String(!Q.debug.ao.excludeSprites);await step();};
document.querySelector('#stairs').onclick=async()=>{mode='stairs';samples.length=0;hideUI();previewCamera=null;Q.teleport(0,-36,0);let z=-36;const task=dt=>{z-=2*dt;Q.setPose(0,z,0,0);if(z<-55)F.tasks.delete(task);};F.tasks.add(task);await step();};
function download(bytes,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);}
document.querySelector('#audio').onclick=async()=>{out.textContent='合成原生音效和音乐…';const end=F.vt/1000;await F.renderAudio(end);download(F.wav,'audio.wav','audio/wav');download(JSON.stringify({t0:t0/1000,end,frames:n,every:1}),'meta.json','application/json');report();};
</script></html>
